# CI for model-eval-harness
#
# Adapted from canon templates/github-actions/ci-python.yml. Every deviation is
# listed here rather than silently dropped, so the gaps are visible:
#
#   1. NO `working-directory: backend`. This repo is a library at the root, not a
#      service with a backend/ directory.
#   2. NO `pip install -e ".[dev]"`. There is no pyproject.toml. Dependencies come
#      from requirements.txt, whose pins mirror the production app EXACTLY and are
#      load-bearing: under pandas 3.x the production scorer's dtype guard stops
#      firing and call_result accuracy collapses from 0.75 to 0.25.
#   3. NO ruff step. No linter is configured yet. Tracked in AGENTS.md > Open items.
#   4. NO mypy step. No type checker is configured yet. Same tracking.
#   5. TRUE_SOURCE_ROOT is deliberately unset. True's production source is not
#      available to CI, so the differential test SKIPS here. CI therefore proves
#      LESS than a local run: it shows the harness is internally consistent, not
#      that it agrees with production. Do not hard-code a current pass count here:
#      the suite grows with each enforced contract. Read the observed count and every
#      skip reason from the CI job. Local pinned reference: 649 passed, 33 skipped on
#      2026-08-08; CI remains authoritative for its own checkout.
#
# Items 3 and 4 are real gaps against canon, not decisions. Closing them means
# adding a pyproject.toml, which is a build change rather than documentation.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # The repository intentionally has no installable package metadata yet; expose
      # both source packages exactly as the team runbook and local verification do.
      PYTHONPATH: src

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Confirm the pins actually installed
        run: |
          python -c "import pandas, numpy, openpyxl; print(f'pandas {pandas.__version__} numpy {numpy.__version__} openpyxl {openpyxl.__version__}')"

      # Runs BEFORE the suite: it is the cheapest step here (about a second against
      # pytest's eighteen) and the most upstream, so a pack that has drifted says so
      # in one line instead of as a scatter of downstream test failures.
      #
      # No network and no API key, verified rather than assumed: `cmd_check`
      # (cli.py:866-904) calls `_load_testset`, `_load_gt` and `_prompt` and nothing
      # else -- it never reaches `_api_key` (cli.py:848) or `build_client`
      # (cli.py:834), which are the only two paths that need either. Confirmed on
      # 2026-08-06 by running both commands below with OPENROUTER_API_KEY,
      # OPEN_ROUTER_API and OPENROUTER_KEY all unset: exit 0, "OK. No problem found."
      #
      # This is not a duplicate of `tests/test_testset_pack.py`. That file gates seven
      # properties of the packs; `check` additionally runs `_gt_disagreements`
      # (cli.py:262), the ONLY thing that ever puts an item's own `gt` beside the
      # ground-truth CSV, and it proves the prompt still assembles from its committed
      # assets. Neither is covered for these packs anywhere else.
      #
      # All four packs are named explicitly, including v1, which is the CLI default
      # (cli.py:131-132). Relying on the default would leave CI checking whichever pack
      # that constant happens to point at, and silently checking one pack twice the day
      # it moves. `test_testset_pack.py` also discovers packs by glob, while these calls
      # exercise the full CLI/ground-truth/prompt-assembly check for each version.
      - name: Validate the committed testset packs
        run: |
          python scripts/evalgen.py check \
            --testset tests/fixtures/testsets/retention_v1.jsonl \
            --gt tests/fixtures/testsets/retention_v1.gt.csv
          python scripts/evalgen.py check \
            --testset tests/fixtures/testsets/retention_v2.jsonl \
            --gt tests/fixtures/testsets/retention_v2.gt.csv
          python scripts/evalgen.py check \
            --testset tests/fixtures/testsets/retention_v3.jsonl \
            --gt tests/fixtures/testsets/retention_v3.gt.csv
          python scripts/evalgen.py check \
            --testset tests/fixtures/testsets/retention_challenge_v1.jsonl \
            --gt tests/fixtures/testsets/retention_challenge_v1.gt.csv

      # RUNS.md is the only committed record that the runs cited in EXPERIMENTS.md ever
      # existed, and it went stale by 16 runs before anything noticed. `out/` is
      # gitignored, so here this step reports NOT CHECKED and proves nothing -- it is in
      # CI so the command is exercised and so a machine that DOES hold the runs fails on
      # a stale index. The real gate is local.
      - name: Verify the committed run index is not stale
        run: python scripts/run_index.py --check

      - name: Validate the Experiment 7 reproduction plan
        run: |
          python scripts/evalgen.py experiment-check \
            --plan experiments/retention-e7.plan.json

      - name: Run tests
        run: pytest tests/ -q -rs

      # The corpus-versus-spec test, run here because CI is where it matters.
      #
      # `asr-eval/tests/` as a whole CANNOT run in this job: requirements-asr.txt pins
      # numpy 2.5.2 against this environment's 2.3.4, and its own header says the two sets
      # "must never merge" because the root pins are production's and change what the scorer
      # computes. So the suite lives behind a separate .venv-asr and only `scripts/verify.py`
      # runs it -- locally, on a machine that has one.
      #
      # That left the one test that reads the LABELLING SPEC and checks the corpus does not
      # contradict it outside CI entirely. It is the test that would have caught the
      # 2026-08-20 defect, where the audio corpus built its `unknown` calls out of the exact
      # phrases the spec rules to be `save` and cost ~0.13 weighted F1 on every arm.
      #
      # It is runnable here because its whole dependency surface -- thai_corpus,
      # business_labels, asr_common -- is pure stdlib, so it needs none of the ASR pins. Its
      # last case skips cleanly when the generated pack is absent, which it always is here.
      - name: Check the corpus does not contradict the labelling spec
        env:
          PYTHONPATH: src:asr-eval/scripts
        run: pytest asr-eval/tests/test_outcome_pools_match_spec.py -q -rs
