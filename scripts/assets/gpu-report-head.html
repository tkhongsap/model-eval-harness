<meta charset="utf-8">
<title>Internal GPU Model Performance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#1b2024; --ink-2:#4a555f; --muted:#7c8791;
  --page:#ebeef0; --card:#ffffff; --rule:#e3e8ea; --rule-2:#cfd7db; --band:#f4f6f7;
  --ours:#e8f0ee; --ours-edge:#b6d0c8; --ours-ink:#12645a;
  --good:#1f6b47; --bad:#9d3520; --warn:#8a5a11;
  --accent:#0b6a70;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#e8edef; --ink-2:#b6c1c8; --muted:#8a959d;
    --page:#0f1417; --card:#171d21; --rule:#283237; --rule-2:#39454b; --band:#1c2429;
    --ours:#14302c; --ours-edge:#2d5a51; --ours-ink:#6fc4b4;
    --good:#79c79c; --bad:#e08a72; --warn:#d3a75a; --accent:#4fb3b7;
  }
}
:root[data-theme="dark"]{
  --ink:#e8edef; --ink-2:#b6c1c8; --muted:#8a959d;
  --page:#0f1417; --card:#171d21; --rule:#283237; --rule-2:#39454b; --band:#1c2429;
  --ours:#14302c; --ours-edge:#2d5a51; --ours-ink:#6fc4b4;
  --good:#79c79c; --bad:#e08a72; --warn:#d3a75a; --accent:#4fb3b7;
}

*{box-sizing:border-box}
body{margin:0; background:var(--page); color:var(--ink); font-size:13.5px; line-height:1.45;
  font-family:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased}
.sheet{max-width:960px; margin:0 auto; padding:24px 20px 40px}

.masthead{display:flex; justify-content:space-between; align-items:flex-end; gap:18px;
  flex-wrap:wrap; margin-bottom:16px}
h1{font-size:19px; font-weight:700; letter-spacing:-.01em; margin:0}
.sub{color:var(--muted); font-size:12px; margin:3px 0 0}
.stamp{font-family:"IBM Plex Mono",monospace; font-size:10.5px; color:var(--muted);
  text-align:right; line-height:1.7}

h2{font-size:13.5px; font-weight:700; margin:18px 0 8px; letter-spacing:-.005em}
h2 .n{font-family:"IBM Plex Mono",monospace; color:var(--accent); font-weight:600; margin-right:6px}

.strip{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:4px}
.tile{background:var(--card); border:1px solid var(--rule-2); border-radius:4px; padding:11px 13px}
.tile .big{font-family:"IBM Plex Mono",monospace; font-size:20px; font-weight:600;
  font-variant-numeric:tabular-nums; line-height:1.1}
.tile .cap{font-size:10.5px; color:var(--muted); margin-top:3px; line-height:1.35}
.tile.win .big{color:var(--good)} .tile.risk .big{color:var(--bad)}

.card{background:var(--card); border:1px solid var(--rule-2); border-radius:4px; overflow-x:auto}
table{border-collapse:collapse; width:100%; min-width:560px}
thead th{padding:9px 13px; text-align:left; border-bottom:1px solid var(--rule-2);
  font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted);
  font-weight:600; background:var(--band)}
thead th.n, tbody td.n{text-align:right}
tbody td{padding:8px 13px; border-bottom:1px solid var(--rule); font-size:12.5px; color:var(--ink-2)}
tbody td.n{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums}
tbody td:first-child{color:var(--ink); font-weight:500}
tbody tr:last-child td{border-bottom:none}
tr.ours td{background:var(--ours)}
tr.ours td:first-child{border-left:2px solid var(--ours-edge)}
.hint{display:block; color:var(--muted); font-size:11px; font-weight:400; margin-top:1px}
.up{color:var(--good); font-weight:600} .dn{color:var(--bad); font-weight:600}
.pill{display:inline-block; padding:1px 7px; border-radius:100px; font-size:10.5px;
  font-family:"IBM Plex Mono",monospace; font-weight:500; white-space:nowrap}
.pill.down{background:#fbeae6; color:#9d3520; border:1px solid #eec4b8}

/* The one-matrix page: wide and short, so it scrolls sideways with the measure column pinned
   to the left edge. Without the pin a reader loses which row they are on by column six. */
.sheet.wide{max-width:1320px}
table.mx{min-width:1100px; border-collapse:separate; border-spacing:0}
table.mx th, table.mx td{border-bottom:1px solid var(--rule)}
table.mx th.ml, table.mx td.ml{position:sticky; left:0; z-index:2; background:var(--card);
  min-width:196px; box-shadow:1px 0 0 var(--rule-2)}
table.mx thead th.ml{background:var(--band)}
table.mx thead th.grp{text-align:center; border-left:2px solid var(--rule-2);
  letter-spacing:.06em; color:var(--ink); background:var(--band)}
table.mx thead th{position:sticky; top:0; z-index:1; background:var(--band)}
table.mx thead tr:first-child th.ml{z-index:3}
table.mx td.cand{background:var(--ours)}
table.mx th.cand{background:var(--ours); color:var(--ours-ink)}
table.mx th.cand .hint{color:var(--ours-ink); opacity:.8}
table.mx tr.emph td{font-weight:600; background:var(--band)}
table.mx tr.emph td.cand{background:var(--ours)}
table.mx tr.emph td.ml{background:var(--band)}
table.mx .muted{color:var(--muted); font-family:"Public Sans",sans-serif; font-size:11px}
table.mx td, table.mx th{padding:7px 11px; white-space:nowrap}
/* ...except the pinned measure column, which carries sentences. Left nowrap it grows to the
   width of its longest sublabel and shoves the data columns off the card. */
table.mx td.ml, table.mx th.ml{white-space:normal; max-width:250px}
table.mx td.ml .hint{white-space:normal}
/* The unit noun under each cost figure is a second line inside a nowrap cell. */
table.mx td.n .hint{white-space:nowrap; font-size:10px}

/* The two-column summary that opens the page. */
table.sum{min-width:0; table-layout:fixed}
table.sum td:first-child, table.sum th:first-child{width:38%}
table.sum td.cand, table.sum th.cand{background:var(--ours)}
table.sum th.cand{color:var(--ours-ink)}
table.sum th.cand .hint{color:var(--ours-ink); opacity:.8}
table.sum tr.emph td{background:var(--band); font-weight:600}
table.sum tr.emph td.cand{background:var(--ours)}
table.sum td.n{vertical-align:top}
table.sum td.muted, table.sum .muted{color:var(--muted); font-family:"Public Sans",sans-serif}

/* Use-case tables: a banded group row, and a tint down the candidate columns so the eye can
   follow "ours" without re-reading the header on every row. */
p.lede{margin:-4px 0 8px; color:var(--muted); font-size:11.5px}
table.uc tbody tr.group td{background:var(--band); border-bottom:1px solid var(--rule-2)}
table.uc tbody tr.group td:first-child{color:var(--ink); font-weight:700; font-size:11.5px}
table.uc tbody tr.group td.cand{background:var(--ours)}
table.uc td.cand{background:var(--ours)}
table.uc thead th.cand{background:var(--ours); color:var(--ours-ink)}
table.uc thead th.cand .hint{color:var(--ours-ink); opacity:.75}
table.uc td:first-child{width:34%}
table.uc tbody td{vertical-align:top}

/* Fixed-layout tables: without this a cell holding a long file path blows the column model up
   and pushes the right-hand columns off the card, where a reader never scrolls to find them. */
table.fixed{table-layout:fixed; min-width:0}
table.fixed td,table.fixed th{overflow-wrap:anywhere; word-break:normal}
table.fixed td .hint{overflow-wrap:anywhere}

.note{margin:12px 0 0; padding:11px 14px; background:var(--card); border:1px solid var(--rule-2);
  border-left:3px solid var(--accent); border-radius:4px; font-size:12px}
.note.risk{border-left-color:var(--bad)}
.note b{color:var(--ink)} .note p{margin:0 0 6px} .note p:last-child{margin-bottom:0}
ul{margin:6px 0 0; padding-left:19px; font-size:12px} li{margin-bottom:4px}
.foot{margin-top:14px; font-size:11px; color:var(--muted)}

@media print{
  @page{size:A4 portrait; margin:9mm}
  body{background:#fff; font-size:8.6pt}
  .sheet{padding:0; max-width:none}
  .card,.tile,.note{border-color:#bbb; overflow:visible}
  table{min-width:0}
  h1{font-size:12.6pt} h2{font-size:9.4pt; margin:11px 0 5px}
  .tile .big{font-size:13pt} .tile .cap{font-size:6.6pt}
  thead th{padding:5px 7px; font-size:6.4pt}
  tbody td{padding:3.6px 7px; font-size:7.7pt}
  .hint{font-size:6.6pt} .note{font-size:7.2pt; padding:7px 9px} ul{font-size:7.4pt}
  .foot{font-size:6.6pt} .strip{gap:6px}
  tr.ours td{background:#e8f0ee !important}
  thead th{background:#f2f4f5 !important}
  .pill.down{background:#fbeae6 !important}
  tr.ours td,thead th,.pill{-webkit-print-color-adjust:exact; print-color-adjust:exact}
}
</style>
