[mypy]
# Lenient baseline, enforced in CI (typecheck job) and by the pre-commit mypy hook.
# `mypy .` must exit 0: new type errors are blocked from day one while the modules under
# `ignore_errors = True` below are burned down. Remove a module's block, fix its errors,
# repeat. Shape from the engineering playbook, toolchains/python.md; the exemplar's
# `plugins = pydantic.mypy` is dropped because nothing here uses pydantic.
#
# Measured at adoption, 2026-09-11: 295 errors in 61 of 132 checked files, hence the 61
# sections below. Regenerate the count with `python -m mypy .` after deleting a section.
warn_return_any = False
warn_unused_configs = True
ignore_missing_imports = True
no_implicit_optional = False

check_untyped_defs = True
explicit_package_bases = True

# src/ on the module path so tests/ and scripts/ see evalgen and evalharness as real
# modules, the same way PYTHONPATH=src does at runtime. Without this every
# `import evalgen` resolves to Any and the check proves nothing about the two packages.
mypy_path = src

# production-reference/  True's code, not ours to type.
# asr-eval/              own pin set in .venv-asr; from the root venv every dependency
#                        would type as Any. Check it from its own venv, later.
# openrouter-smoketest/  directory name is not an importable module path; exploratory.
# .venv, .venv-asr       virtualenvs.
exclude = (?x)(
      ^production-reference/
    | ^asr-eval/
    | ^scripts/openrouter-smoketest/
    | ^\.venv/
    | ^\.venv-asr/
    )

# ---------------------------------------------------------------------------
# Burn-down list: modules still exempt from type checking. Shrink it, don't grow it.
# Order: src packages first (the ones a reader should fix first), then scripts, then
# tests. Error counts at adoption are in changes/2026-09-11-adopt-toolchain/intent.md.
# ---------------------------------------------------------------------------

