# Pre-commit hooks mirroring the CI gates so local commits fail for the same
# reasons PRs would. See .github/workflows/ci.yml (jobs: lint, typecheck) for the
# CI equivalents. Adapted for pip from the engineering playbook,
# toolchains/pre-commit.md; decisions in changes/2026-09-11-adopt-toolchain/.
#
# Run from the ACTIVATED root venv (`source .venv/bin/activate`), because the mypy
# hook below is `language: system` and calls whichever `python` is on PATH.
#
# Install:            pip install -r requirements-dev.txt && pre-commit install
# Run on all files:   pre-commit run --all-files
# Update hook versions: pre-commit autoupdate --freeze   (keeps SHA pins; then match ruff's
#                       version in requirements-dev.txt)

# Paths the two FIXER hooks below may not rewrite (read-only checks still see them).
# Every one of these is either sha256-pinned, byte-exact by contract, generated by a
# script, or not ours:
#   production-reference/   True's vendored source, kept verbatim so citations resolve
#   asr-eval/               corpus, manifest and reports are hash-pinned in the E23/E24
#                           plans; scripts there are linted by ruff below, deliberately
#                           (ruff needs none of asr-eval's own pins)
#   experiments/            plans are self-hashed; evidence is a frozen export
#   tests/fixtures/         testsets are byte-exact (CR-refusing) and sha-pinned
#   src/evalgen/prompts/    Prompt.sha is a sha256 over exactly these bytes
#   src/evalgen/schemas/    sha-pinned in every plan
#   docs/reports/           generated by scripts/, read by scripts/doc_claims.py
#   configs/                runtime manifests are fingerprinted; the .pem is a cert
# Measured before adoption: the two prompt files carry trailing whitespace today, so an
# unexcluded `trailing-whitespace` hook would silently break every experiment plan.
repos:
  # ── Basic hygiene ──────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # v6.0.0
    hooks:
      - id: check-added-large-files   # blocks >500 KB binaries (audio packs are gitignored by policy)
      - id: check-merge-conflict      # catches unresolved conflict markers
      - id: check-yaml                # validates YAML syntax
      - id: check-toml                # validates TOML syntax
      - id: end-of-file-fixer         # ensures files end with a newline
        exclude: >
          (?x)^(
            production-reference/
            | asr-eval/(?!.*\.py$)
            | experiments/
            | tests/fixtures/
            | src/evalgen/prompts/
            | src/evalgen/schemas/
            | docs/reports/
            | configs/
          )
      - id: trailing-whitespace       # removes stray trailing whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: >
          (?x)^(
            production-reference/
            | asr-eval/(?!.*\.py$)
            | experiments/
            | tests/fixtures/
            | src/evalgen/prompts/
            | src/evalgen/schemas/
            | docs/reports/
            | configs/
          )

  # ── Ruff: Python lint (mirrors CI lint job) ────────────────────────
  # Hook id is `ruff-check`; the playbook block says `ruff`, which ruff-pre-commit
  # v0.16 reports as a legacy alias.
  # Version kept in sync with requirements-dev.txt.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: e8f7d69b957a30acb2c875078d5fd012de24b64c  # v0.16.7
    hooks:
      # `ruff check --fix` — applies safe auto-fixes (e.g. import sorting)
      # and reports remaining violations. CI runs `ruff check .` without
      # --fix; the local auto-fix saves iteration with no drift risk.
      - id: ruff-check
        args: [--fix]
        # The vendored projects under production-reference/ carry their own [tool.ruff],
        # and ruff resolves config per file to the NEAREST pyproject — so neither the
        # root extend-exclude nor force-exclude reaches them once pre-commit passes the
        # paths explicitly. Exclude here, at the source of the file list.
        exclude: ^production-reference/
      # `ruff-format` is deliberately NOT enabled. 137 of 226 files would be
      # reformatted, and this repository's prose cites file:line into source.
      # Stated gap, tracked in AGENTS.md "Commands"; adopt in its own change.

  # ── Mypy: Python type check (mirrors CI typecheck job) ─────────────
  # `language: system` so mypy runs from the project's own venv with the
  # production pins installed, exactly as CI does. Pre-commit's isolated
  # mirror-mypy would not see pandas/numpy/openpyxl — that is drift.
  #
  # Type-checking the whole tree on every commit is slower than the per-file
  # hooks above (measured 2026-09-11: 1.5 s cold cache, 0.08 s warm, 132 files).
  # Skip it with `SKIP=mypy git commit`;
  # CI still runs it.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: python -m mypy .
        language: system
        types: [python]
        pass_filenames: false
        verbose: true
