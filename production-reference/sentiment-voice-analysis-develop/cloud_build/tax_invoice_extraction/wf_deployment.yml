substitutions:
  # ===== REQUIRED: Set via trigger or command line =====
  _ENVIRONMENT: nprd  # Options: nprd, release, prod
  _IMAGE_TAG: latest  # Override this to deploy specific version (e.g., v1.0.0, v1.0.0-rc1)

  # ===== COMMON CONFIGURATION =====
  _REGION: asia-southeast3
  _IMAGE_NAME: ai_tax_inv_reconcile
  _TIMEZONE: Asia/Bangkok

  # ===== ENVIRONMENT-SPECIFIC (auto-configured based on _ENVIRONMENT) =====
  # These are dynamically set in the steps, but can be overridden
  _REPOSITORY: ${_ENVIRONMENT}-ai-tax-inv-reconcile-artifact-repo

  # ===== PROD-SPECIFIC (only for prod environment) =====
  _SOURCE_PROJECT_ID: ''  # Source project for image promotion (nprd/release project)
  _SOURCE_REPOSITORY: release-ai-tax-inv-reconcile-artifact-repo
  _SOURCE_IMAGE_TAG: ''   # Source image tag for prod promotion (e.g., tax-inv-v1.0.0-rc1)

  # ===== TERRAFORM CONFIGURATION =====
  _TERRAFORM_VERSION: 1.13.3
  _TERRAFORM_PROJECT_PATH: terraform/projects/tax_invoice_extraction
  _STATE_BUCKET: ${PROJECT_ID}-terraform-state
  _TERRAFORM_ACTION: apply  # Options: plan, apply

  # ==== PRISMA CONFIGURATION =====
  _PRISMA_API_VERSION: v1
  # Minimum finding severity that fails the build: high | critical.
  _SCAN_SEVERITY_THRESHOLD: high

# These CI secrets are a manual prerequisite: they are NOT in the Terraform
# module's locals.secret_names, so nothing in this pipeline creates them.
# On a fresh project they must be created and populated by hand (service
# request) before the first build, or it fails at the first referencing step.
availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/PRISMA_USER/versions/latest
      env: PCC_USER
    - versionName: projects/${PROJECT_ID}/secrets/PRISMA_PASSWORD/versions/latest
      env: PCC_PASSWORD
    - versionName: projects/${PROJECT_ID}/secrets/PRISMA_CONSOLE_URL/versions/latest
      env: PCC_CONSOLE_URL
    - versionName: projects/${PROJECT_ID}/secrets/SONARQUBE_ORG/versions/latest
      env: SONAR_ORG
    - versionName: projects/${PROJECT_ID}/secrets/SONARQUBE_PROJECT/versions/latest
      env: SONAR_PROJECT
    - versionName: projects/${PROJECT_ID}/secrets/SONARQUBE_TOKEN/versions/latest
      env: SONAR_TOKEN
    - versionName: projects/${PROJECT_ID}/secrets/SONARQUBE_GITHUB_PAT/versions/latest
      env: SONAR_GITHUB_PAT

steps:
# ========================================
# Step 0: Environment Configuration & Tag Validation
# ========================================
- name: 'gcr.io/cloud-builders/gcloud'
  id: 'configure-environment'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -eo pipefail
    echo "================================================"
    echo "Deployment Configuration"
    echo "================================================"
    echo "Environment:       ${_ENVIRONMENT}"
    echo "Project ID:        $PROJECT_ID"
    echo "Region:            ${_REGION}"
    echo "Repository:        ${_REPOSITORY}"
    echo "Image:             ${_IMAGE_NAME}"
    echo "================================================"

    # Validate environment
    if [[ ! "${_ENVIRONMENT}" =~ ^(nprd|release|prod)$ ]]; then
      echo "❌ ERROR: Invalid environment '${_ENVIRONMENT}'"
      echo "Valid options: nprd, release, prod"
      exit 1
    fi

    # Determine image tag
    IMAGE_TAG="${_IMAGE_TAG}"

    # If TAG_NAME is set (git tag trigger), use it
    if [ -n "$TAG_NAME" ]; then
      IMAGE_TAG="$TAG_NAME"
      echo "📌 Tag-based deployment: $TAG_NAME"

      # Validate tag format for release environment
      if [ "${_ENVIRONMENT}" = "release" ]; then
        if [[ ! "$TAG_NAME" =~ ^tax-inv-v[0-9]+\.[0-9]+\.[0-9]+-rc[0-9]+$ ]]; then
          echo "❌ ERROR: Release environment requires tag format tax-inv-vX.X.X-rcX (e.g., tax-inv-v1.0.0-rc1)"
          echo "   Got: $TAG_NAME"
          exit 1
        fi
        echo "✅ Valid release candidate tag: $TAG_NAME"
      fi

      # Validate tag format for prod environment
      if [ "${_ENVIRONMENT}" = "prod" ]; then
        if [[ ! "$TAG_NAME" =~ ^tax-inv-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "❌ ERROR: Production environment requires stable tag format tax-inv-vX.X.X (e.g., tax-inv-v1.0.0)"
          echo "   Got: $TAG_NAME"
          echo "   Note: Release candidate tags (tax-inv-vX.X.X-rcX) are not allowed in prod"
          exit 1
        fi
        echo "✅ Valid production tag: $TAG_NAME"
      fi
    elif [ -n "$COMMIT_SHA" ]; then
      IMAGE_TAG="$COMMIT_SHA"
      echo "📝 Commit-based deployment: $COMMIT_SHA"
    else
      echo "📎 Using _IMAGE_TAG substitution: $$IMAGE_TAG"
    fi

    # Save IMAGE_TAG for subsequent steps
    echo "$$IMAGE_TAG" > /workspace/image_tag.txt

    echo "Image Tag:         $$IMAGE_TAG"
    echo "================================================"

# ========================================
# Step 1: Build Docker Image (nprd/release only)
# ========================================
- name: 'gcr.io/cloud-builders/docker'
  id: 'build-image'
  entrypoint: 'bash'
  env:
  - 'REGION=${_REGION}'
  - 'DEFAULT_BUCKETS_BEHAVIOR=regional-user-owned-bucket'
  args:
  - '-c'
  - |
    set -eo pipefail
    IMAGE_TAG=$(cat /workspace/image_tag.txt)

    if [ "${_ENVIRONMENT}" != "prod" ]; then
      echo "🔨 Building Docker image for ${_ENVIRONMENT}..."
      echo "   Tag: $$IMAGE_TAG"
      echo "   Note: Image will be held locally until Artifact Registry is created"

      # Build with specific tag
      docker build -f cloud_build/tax_invoice_extraction/Dockerfile -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:$$IMAGE_TAG .

      # Also tag as latest for convenience
      docker tag \
        ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:$$IMAGE_TAG \
        ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:latest

      echo "✅ Image built and ready to push after infrastructure deployment"
    else
      echo "⏭️  Skipping build for ${_ENVIRONMENT} (will promote from release)"
    fi

# ========================================
# Step 2: Terraform Init
# ========================================
- name: 'hashicorp/terraform:${_TERRAFORM_VERSION}'
  id: 'terraform-init'
  entrypoint: 'sh'
  args:
  - '-c'
  - |
    set -e
    cd ${_TERRAFORM_PROJECT_PATH}
    echo "================================================"
    echo "Initializing Terraform"
    echo "================================================"
    echo "Environment: ${_ENVIRONMENT}"
    echo "State Bucket: ${_STATE_BUCKET}"
    terraform init \
      -backend-config="bucket=${_STATE_BUCKET}" \
      -backend-config="prefix=terraform-state/${_ENVIRONMENT}-tax-invoice-extraction"
    echo "✅ Terraform initialized successfully!"

# ========================================
# Step 3: Terraform Validate
# ========================================
- name: 'hashicorp/terraform:${_TERRAFORM_VERSION}'
  id: 'terraform-validate'
  entrypoint: 'sh'
  args:
  - '-c'
  - |
    set -e
    cd ${_TERRAFORM_PROJECT_PATH}
    echo "================================================"
    echo "Validating Terraform Configuration"
    echo "================================================"
    terraform validate
    echo "✅ Terraform configuration is valid!"

# ========================================
# Step 4a: List existing Secret Manager secrets
# The hashicorp/terraform image has no gcloud, so the listing runs in its own
# gcloud step and hands the names to the import step via /workspace/secrets.txt.
# ========================================
- name: 'gcr.io/cloud-builders/gcloud'
  id: 'list-secrets'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -eo pipefail
    gcloud secrets list \
      --project=$PROJECT_ID \
      --format="value(name)" > /workspace/secrets.txt
    echo "Found $(wc -l < /workspace/secrets.txt | tr -d ' ') secret(s) in project."

# ========================================
# Step 4b: Import existing Secret Manager secrets into Terraform state
# Secrets created outside Terraform (manually, or from a previous run) cause
# Error 409 on create. This step imports them so Terraform manages them instead.
# Idempotent: already-managed secrets are skipped silently.
# ========================================
- name: 'hashicorp/terraform:${_TERRAFORM_VERSION}'
  id: 'terraform-import-secrets'
  entrypoint: 'sh'
  args:
  - '-c'
  - |
    set -e
    cd ${_TERRAFORM_PROJECT_PATH}

    echo "================================================"
    echo "Importing existing secrets into Terraform state"
    echo "================================================"

    if [ ! -s /workspace/secrets.txt ]; then
      echo "No secrets found in project — nothing to import."
    else
      while read -r SECRET_RESOURCE; do
        [ -n "$$SECRET_RESOURCE" ] || continue
        SECRET_NAME=$$(basename "$$SECRET_RESOURCE")

        # Only secrets declared in locals.secret_names have a configuration to
        # import into; CI/manual secrets (PRISMA_*, SONARQUBE_*) would just make
        # terraform error "Configuration for import target does not exist".
        if ! grep -q "\"$$SECRET_NAME\"" locals.tf; then
          echo "  ⏭️  Not managed by this module (CI/manual secret): $$SECRET_NAME"
          continue
        fi

        # Check if already in state
        ADDR="module.tax_invoice_extraction_secrets[\"$$SECRET_NAME\"].google_secret_manager_secret.default"
        if terraform state show "$$ADDR" > /dev/null 2>&1; then
          echo "  ✅ Already in state: $$SECRET_NAME"
        else
          echo "  📥 Importing: $$SECRET_NAME"
          terraform import \
            -var-file=${_ENVIRONMENT}_config.tfvars \
            -var="image_tag=placeholder" \
            -var="image_name=${_IMAGE_NAME}" \
            "$$ADDR" \
            "projects/$PROJECT_ID/secrets/$$SECRET_NAME" \
            2>&1 && echo "     Imported." || echo "  ⚠️  Skipped (not managed by this module)"
        fi
      done < /workspace/secrets.txt
    fi

    echo "================================================"
    echo "✅ Secret import pass complete."
    echo "================================================"

# ========================================
# Step 5: Terraform Plan
# ========================================
- name: 'hashicorp/terraform:${_TERRAFORM_VERSION}'
  id: 'terraform-plan'
  entrypoint: 'sh'
  args:
  - '-c'
  - |
    set -e
    cd ${_TERRAFORM_PROJECT_PATH}
    IMAGE_TAG=$(cat /workspace/image_tag.txt)
    echo "================================================"
    echo "Planning Terraform Changes"
    echo "================================================"
    echo "Image Tag: $$IMAGE_TAG"
    terraform get -update
    # The Eventarc API intermittently answers trigger reads with a
    # "Pub/Sub topic status is unknown" condition that crashes the provider's
    # refresh. Retry only on that signature; any other error fails fast.
    attempt=1
    while :; do
      set +e
      terraform plan \
        -var-file=${_ENVIRONMENT}_config.tfvars \
        -var="image_tag=$$IMAGE_TAG" \
        -var="image_name=${_IMAGE_NAME}" > /tmp/tf_out.log 2>&1
      rc=$?
      set -e
      cat /tmp/tf_out.log
      if [ "$$rc" -eq 0 ]; then
        break
      fi
      if [ "$$attempt" -ge 3 ] || ! grep -q "Pub/Sub topic status is unknown" /tmp/tf_out.log; then
        exit "$$rc"
      fi
      attempt=$((attempt+1))
      echo "⚠️  Eventarc API flap detected — retrying terraform plan ($$attempt/3) in 30s..."
      sleep 30
    done
    echo "✅ Terraform plan completed!"

# ========================================
# Step 6: Terraform Apply — Pre-requisite infrastructure
# Creates Artifact Registry, GCS bucket, and Secret shells
# before the image is pushed and Cloud Run is provisioned.
# ========================================
- name: 'hashicorp/terraform:${_TERRAFORM_VERSION}'
  id: 'terraform-apply-prereqs'
  entrypoint: 'sh'
  args:
  - '-c'
  - |
    set -e
    cd ${_TERRAFORM_PROJECT_PATH}
    if [ "${_TERRAFORM_ACTION}" = "apply" ]; then
      IMAGE_TAG=$(cat /workspace/image_tag.txt)
      echo "================================================"
      echo "Applying Terraform — Pre-requisite Infrastructure"
      echo "  • Artifact Registry"
      echo "  • GCS Bucket"
      echo "  • Secret Manager secrets (shells only, no values)"
      echo "================================================"
      terraform apply \
        -target=module.tax_invoice_extraction_artifact_registry \
        -target=module.tax_invoice_extraction_bucket \
        -target=module.tax_invoice_extraction_secrets \
        -var-file=${_ENVIRONMENT}_config.tfvars \
        -var="image_tag=$$IMAGE_TAG" \
        -var="image_name=${_IMAGE_NAME}" \
        -auto-approve
      echo "✅ Pre-requisite infrastructure created/confirmed!"
    else
      echo "⏭️  Plan-only mode. Skipping prereqs apply."
    fi

# ========================================
# Step 7: Bootstrap secret versions
# Adds an __UNSET__ initial version to any secret that has zero versions,
# so Cloud Run can be provisioned. Real values must be set manually by humans.
# Idempotent: secrets that already have versions are untouched.
# ========================================
- name: 'gcr.io/cloud-builders/gcloud'
  id: 'init-secret-versions'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -eo pipefail
    echo "================================================"
    echo "Bootstrapping secret initial versions"
    echo "================================================"

    SECRETS=$(gcloud secrets list \
      --project=$PROJECT_ID \
      --format="value(name)" 2>/dev/null || true)

    if [ -z "$$SECRETS" ]; then
      echo "No secrets found — nothing to bootstrap."
    else
      for SECRET_RESOURCE in $$SECRETS; do
        SECRET_NAME=$$(basename "$$SECRET_RESOURCE")
        VERSION_COUNT=$$(gcloud secrets versions list "$$SECRET_NAME" \
          --project=$PROJECT_ID \
          --filter="state=ENABLED" \
          --format="value(name)" 2>/dev/null | wc -l | tr -d ' ')

        if [ "$$VERSION_COUNT" -eq "0" ]; then
          echo "  📝 Adding initial version: $$SECRET_NAME"
          echo -n "__UNSET__" | gcloud secrets versions add "$$SECRET_NAME" \
            --data-file=- --project=$PROJECT_ID
        else
          echo "  ✅ Already has version(s): $$SECRET_NAME"
        fi
      done
    fi

    echo "================================================"
    echo "✅ Secret version bootstrap complete."
    echo "================================================"

# ========================================
# Step 7.5: Run pytest with coverage (feeds the sonar scan)
# ========================================
- name: "ghcr.io/astral-sh/uv:python3.11-bookworm-slim"
  id: "run-tests"
  waitFor: ['-']
  entrypoint: "bash"
  args:
    - "-c"
    - |
      set -euo pipefail
      echo "🧪 Running pytest with coverage..."

      uv sync --frozen
      uv run pytest \
        --cov-report=xml:coverage.xml \
        --junitxml=test-results.xml

      echo "✅ Tests passed — coverage.xml + test-results.xml written"

# ========================================
# Step 7.6: Un-shallow the git clone
# Cloud Build fetches the source at depth 1; SonarCloud needs the full history for
# SCM blame, issue auto-assignment, and commit-date-based new-code detection.
# ========================================
- name: "gcr.io/cloud-builders/git"
  id: "unshallow-repo"
  waitFor: ['-']
  entrypoint: "bash"
  secretEnv: ["SONAR_GITHUB_PAT"]
  args:
    - "-c"
    - |
      set -euo pipefail
      git config --global --add safe.directory /workspace

      if [ ! -d .git ]; then
        echo "⚠️  No .git directory — skipping. Sonar SCM data will be unavailable."
        exit 0
      fi

      if [ ! -f .git/shallow ]; then
        echo "✅ Repository already has full history — nothing to do."
        exit 0
      fi

      # The token goes in an ephemeral header rather than the remote URL, so it is
      # never persisted to .git/config where later build steps could read it.
      git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$$SONAR_GITHUB_PAT" | base64 -w0)" \
        fetch --unshallow origin

      echo "✅ Full history fetched."

# ========================================
# Step 8: SonarQube Source Code Scan
# Runs SonarQube scanner on the source code to detect code quality issues and vulnerabilities.
# ========================================
- name: "sonarsource/sonar-scanner-cli:11"
  id: "source-code-scan"
  waitFor: ["init-secret-versions", "run-tests", "unshallow-repo"]
  entrypoint: "bash"
  secretEnv: ["SONAR_ORG", "SONAR_PROJECT", "SONAR_TOKEN"]
  args:
    - "-c"
    - |
      set -euo pipefail
      echo "🔍 Scanning source code with SonarQube..."

      # The scanner image runs as a non-root user while /workspace is
      # root-owned from earlier steps, so its working directory (the only
      # place it writes) must live outside the workspace.
      # sonar.exclusions lists every artifact other build steps write into
      # /workspace (the parallel Prisma branch writes image-scan.json
      # root-only-readable, which otherwise crashes the indexer). Any future
      # step that writes a new file into /workspace must be added here.
      # sonar.sources is scoped to production + infra code because SonarCloud
      # counts every analyzed source line toward the org's subscription LOC
      # quota; tests/ is declared via sonar.tests so it stays analyzed
      # (test-specific rules) without counting toward the quota.
      # sonar.plsql.file.suffixes drops .sql from the PL/SQL analyzer's claim:
      # reconciliation.sql is DuckDB SQL, and Oracle PL/SQL rules would only
      # demand a Data Dictionary this project has no use for.

      # git refuses to read the root-owned /workspace as the scanner's non-root
      # user ("dubious ownership"), which would silently disable SCM blame.
      export GIT_CONFIG_GLOBAL=/tmp/gitconfig
      git config --global --add safe.directory /workspace

      sonar-scanner \
        -Dsonar.host.url=https://sonarcloud.io \
        -Dsonar.organization=$$SONAR_ORG \
        -Dsonar.projectKey=$$SONAR_PROJECT \
        -Dsonar.token=$$SONAR_TOKEN \
        -Dsonar.working.directory=/tmp/.scannerwork \
        -Dsonar.sources=src,tasks,main.py,config,cloud_build,terraform \
        -Dsonar.tests=tests \
        -Dsonar.python.version=3.11,3.12 \
        -Dsonar.sourceEncoding=UTF-8 \
        -Dsonar.exclusions=twistcli,image-scan.json,scan_digest.txt,image_tag.txt,secrets.txt,tasks/sentiment_telesale/**,tasks/sentiment_qa/**,**/*.xlsx,.venv/** \
        -Dsonar.plsql.file.suffixes=.pks,.pkb \
        -Dsonar.python.coverage.reportPaths=coverage.xml \
        -Dsonar.python.xunit.reportPaths=test-results.xml \
        -Dsonar.qualitygate.wait=true

      echo "✅ SonarQube scan completed successfully!"

# ========================================
# Step 9: Fetch twistcli (Prisma Cloud scanner)
# Download the CLI from the Console so its version matches the backend.
# ========================================
- name: "gcr.io/cloud-builders/curl"
  id: "fetch-twistcli"
  waitFor: ["init-secret-versions"]
  entrypoint: "bash"
  secretEnv: ["PCC_USER", "PCC_PASSWORD", "PCC_CONSOLE_URL"]
  args:
    - "-c"
    - |
      set -euo pipefail
      curl -fsSL -u "$$PCC_USER:$$PCC_PASSWORD" \
        -o /workspace/twistcli \
        "$$PCC_CONSOLE_URL/api/${_PRISMA_API_VERSION}/util/twistcli"
      chmod +x /workspace/twistcli
      /workspace/twistcli --version

# ========================================
# Step 10: Scan image (Prisma vuln + compliance report)
# Non-prod scans the locally built image; prod pulls the source image by
# digest first. The scan does not abort the step and does not gate the build
# itself — it only writes the JSON report. The severity gate is applied by the
# enforce-scan-gate step (step 12) after the report is archived, by parsing it.
# (This twistcli build does not support --vulnerability-threshold /
# --compliance-threshold, so gating is derived from the report, not twistcli's
# exit code.)
# ========================================
- name: "gcr.io/cloud-builders/docker"
  id: "scan-image"
  waitFor: ["fetch-twistcli"]
  entrypoint: "bash"
  secretEnv: ["PCC_USER", "PCC_PASSWORD", "PCC_CONSOLE_URL"]
  args:
    - "-c"
    - |
      set -euo pipefail
      IMAGE_TAG=$(cat /workspace/image_tag.txt)

      echo "🔍 Scanning Docker image for vulnerabilities..."

      if [ "${_ENVIRONMENT}" == "prod" ]; then
        if [ -z "${_SOURCE_PROJECT_ID}" ]; then
          echo "❌ ERROR: _SOURCE_PROJECT_ID is required for prod promotion"
          exit 1
        fi

        # Determine source image tag (use _SOURCE_IMAGE_TAG if set, otherwise IMAGE_TAG)
        SOURCE_TAG="$$IMAGE_TAG"
        if [ -n "${_SOURCE_IMAGE_TAG}" ]; then
          SOURCE_TAG="${_SOURCE_IMAGE_TAG}"
        fi

        SOURCE_IMAGE="${_REGION}-docker.pkg.dev/${_SOURCE_PROJECT_ID}/${_SOURCE_REPOSITORY}/${_IMAGE_NAME}:$$SOURCE_TAG"

        echo "📥 Pulling source image so the scanner can read it: $$SOURCE_IMAGE"
        docker pull "$$SOURCE_IMAGE"

        # Pin to the immutable digest so the scanned bytes == the promoted bytes.
        SCAN_TARGET=$(docker inspect --format='{{index .RepoDigests 0}}' "$$SOURCE_IMAGE" 2>/dev/null || true)
        if [ -z "$$SCAN_TARGET" ]; then
          echo "⚠️  Could not resolve digest; falling back to the tag reference"
          SCAN_TARGET="$$SOURCE_IMAGE"
        fi

        # Hand the exact scanned reference to promote-image, so the promoted
        # bytes are provably the scanned bytes (digest when resolvable).
        echo "$$SCAN_TARGET" > /workspace/scan_digest.txt

        echo "📌 Scanning source image for prod promotion: $$SCAN_TARGET"
      else
        SCAN_TARGET="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:$$IMAGE_TAG"
        echo "📌 Scanning built image for ${_ENVIRONMENT}: $$SCAN_TARGET"
      fi

      # Run the scan WITHOUT aborting the step on a policy breach, so the report
      # is still archived (next step) even when the gate fails — that report is
      # exactly what explains why a build was blocked. The captured exit code is
      # enforced by the dedicated gate step after archiving.
      set +e
      /workspace/twistcli images scan \
        --address "$$PCC_CONSOLE_URL" \
        --user "$$PCC_USER" \
        --password "$$PCC_PASSWORD" \
        --details \
        --ci \
        --output-file /workspace/image-scan.json \
        "$$SCAN_TARGET"
      SCAN_RC=$?
      set -e

      echo "ℹ️  twistcli exit code: $$SCAN_RC (informational — the severity gate is applied from the report in step 12)"

# ========================================
# Step 11: Archive scan results to Cloud Storage
# Runs whether or not the scan passed, so the report that explains a
# blocked build is always retained for audit.
# ========================================
- name: "gcr.io/cloud-builders/gcloud"
  id: "archive-scan-results"
  waitFor: ["scan-image"]
  entrypoint: "bash"
  args:
    - "-c"
    - |
      set -uo pipefail

      echo "📁 Archiving scan results to Cloud Storage..."

      DEST="${_STATE_BUCKET}/PRISMA_IMAGE_SCAN/${BUILD_ID}/"
      [ -f /workspace/image-scan.json ] \
        && gcloud storage cp /workspace/image-scan.json "gs://$${DEST}image-scan.json" \
        || echo "⚠️  No scan report found to archive."

      echo "✅ Scan results archived to gs://$${DEST}image-scan.json"

# ========================================
# Step 12: Enforce the scan gate
# Runs AFTER archiving, so a blocked build still has its explaining report in
# GCS. Parses the twistcli JSON report and FAILS the build when any
# vulnerability or compliance finding has severity >= _SCAN_SEVERITY_THRESHOLD.
# Fails closed: a missing/unparseable report blocks the build.
# ========================================
- name: "gcr.io/cloud-builders/gcloud"
  id: "enforce-scan-gate"
  waitFor: ["archive-scan-results"]
  entrypoint: "bash"
  env:
  - 'SCAN_SEVERITY_THRESHOLD=${_SCAN_SEVERITY_THRESHOLD}'
  args:
    - "-c"
    - |
      set -uo pipefail
      REPORT=/workspace/image-scan.json

      if [ ! -f "$$REPORT" ]; then
        echo "❌ Scan report not found at $$REPORT — failing closed (cannot prove the image is clean)."
        exit 1
      fi

      python3 - "$$REPORT" <<'PY'
      import json, os, sys

      ORDER = ["low", "medium", "high", "critical"]
      threshold = os.environ.get("SCAN_SEVERITY_THRESHOLD", "high").lower()
      if threshold not in ORDER:
          print(f"❌ Invalid SCAN_SEVERITY_THRESHOLD={threshold!r}; expected one of {ORDER}.")
          sys.exit(1)
      gated = set(ORDER[ORDER.index(threshold):])

      try:
          with open(sys.argv[1]) as fh:
              scan = json.load(fh)
      except (ValueError, OSError) as exc:
          print(f"❌ Could not parse scan report ({exc}); failing closed.")
          sys.exit(1)

      results = scan.get("results") or []
      if not results:
          print("❌ Scan report contains no results; failing closed.")
          sys.exit(1)

      vuln_hits, comp_hits = [], []
      for result in results:
          for vuln in (result.get("vulnerabilities") or []):
              if str(vuln.get("severity", "")).lower() in gated:
                  vuln_hits.append(vuln)
          for comp in (result.get("compliances") or []):
              if str(comp.get("severity", "")).lower() in gated:
                  comp_hits.append(comp)

      print(f"Gate threshold: {threshold} and above ({sorted(gated)})")
      print(f"Vulnerabilities at/above threshold: {len(vuln_hits)}")
      print(f"Compliance findings at/above threshold: {len(comp_hits)}")

      if vuln_hits or comp_hits:
          print("❌ Prisma scan gate FAILED — findings at or above the threshold. Blocking push/promote.")
          sys.exit(1)
      print("✅ Prisma scan gate passed — no findings at or above the threshold.")
      PY

# ========================================
# Step 13: Push Docker Image (nprd/release only)
# Registry now exists — safe to push.
# ========================================
- name: 'gcr.io/cloud-builders/docker'
  id: 'push-image'
  waitFor: ["enforce-scan-gate", "source-code-scan"]
  entrypoint: 'bash'
  env:
  - 'REGION=${_REGION}'
  - 'DEFAULT_BUCKETS_BEHAVIOR=regional-user-owned-bucket'
  args:
  - '-c'
  - |
    set -eo pipefail
    if [ "${_TERRAFORM_ACTION}" != "apply" ]; then
      echo "⏭️  Plan-only mode. Skipping image push."
      exit 0
    fi
    IMAGE_TAG=$(cat /workspace/image_tag.txt)

    if [ "${_ENVIRONMENT}" != "prod" ]; then
      echo "📤 Pushing image to Artifact Registry..."
      echo "   Repository: ${_REPOSITORY}"
      echo "   Tag: $$IMAGE_TAG"

      # Push with specific tag
      docker push ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:$$IMAGE_TAG

      # Also push latest
      docker push ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:latest

      echo "✅ Image pushed successfully to Artifact Registry: $$IMAGE_TAG"
    else
      echo "⏭️  Skipping push for ${_ENVIRONMENT} (promotion flow)"
    fi

# ========================================
# Step 14: Pull and Promote Image (prod only)
# Registry now exists — safe to push promoted image.
# ========================================
- name: 'gcr.io/cloud-builders/docker'
  id: 'promote-image'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -eo pipefail
    if [ "${_TERRAFORM_ACTION}" != "apply" ]; then
      echo "⏭️  Plan-only mode. Skipping image promotion."
      exit 0
    fi
    IMAGE_TAG=$(cat /workspace/image_tag.txt)

    if [ "${_ENVIRONMENT}" = "prod" ]; then
      if [ -z "${_SOURCE_PROJECT_ID}" ]; then
        echo "❌ ERROR: _SOURCE_PROJECT_ID is required for prod promotion"
        exit 1
      fi

      # Determine source image tag (use _SOURCE_IMAGE_TAG if set, otherwise IMAGE_TAG)
      SOURCE_TAG="$$IMAGE_TAG"
      if [ -n "${_SOURCE_IMAGE_TAG}" ]; then
        SOURCE_TAG="${_SOURCE_IMAGE_TAG}"
      fi

      # For production, we promote from release repository
      SOURCE_IMAGE="${_REGION}-docker.pkg.dev/${_SOURCE_PROJECT_ID}/${_SOURCE_REPOSITORY}/${_IMAGE_NAME}:$$SOURCE_TAG"
      TARGET_IMAGE="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:$$IMAGE_TAG"

      echo "🔄 Promoting image to production..."
      echo "Source: $$SOURCE_IMAGE"
      echo "Target: $$TARGET_IMAGE"
      echo "Source Tag: $$SOURCE_TAG"
      echo "Target Tag: $$IMAGE_TAG"

      # Validate target tag is stable (no -rc)
      if [[ "$$IMAGE_TAG" =~ -rc ]]; then
        echo "❌ ERROR: Cannot promote release candidate to production"
        echo "   Tag: $$IMAGE_TAG"
        echo "   Production requires stable tags (e.g., tax-inv-v1.0.0, not tax-inv-v1.0.0-rc1)"
        exit 1
      fi

      # Pull exactly the bytes the Prisma scan approved (digest handoff from
      # scan-image), not a fresh by-tag pull that could race a re-pushed tag.
      if [ ! -s /workspace/scan_digest.txt ]; then
        echo "❌ ERROR: /workspace/scan_digest.txt not found — cannot prove scanned bytes == promoted bytes"
        exit 1
      fi
      SOURCE_REF=$(cat /workspace/scan_digest.txt)
      echo "📥 Pulling scanned source reference: $$SOURCE_REF"
      docker pull "$$SOURCE_REF"

      # Tag for prod
      docker tag "$$SOURCE_REF" $$TARGET_IMAGE
      docker tag "$$SOURCE_REF" ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:latest

      # Push to prod
      echo "📤 Pushing to production Artifact Registry..."
      docker push $$TARGET_IMAGE
      docker push ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:latest

      echo "✅ Image promoted successfully to production: $$IMAGE_TAG (from source: $$SOURCE_TAG)"
    else
      echo "⏭️  Skipping image promotion (not prod environment)"
    fi

# ========================================
# Step 15: Terraform Apply — Full infrastructure
# Image now exists in registry, every secret has ≥1 version — Cloud Run job can be created.
# ========================================
- name: 'hashicorp/terraform:${_TERRAFORM_VERSION}'
  id: 'terraform-apply-full'
  entrypoint: 'sh'
  args:
  - '-c'
  - |
    set -e
    cd ${_TERRAFORM_PROJECT_PATH}
    if [ "${_TERRAFORM_ACTION}" = "apply" ]; then
      IMAGE_TAG=$(cat /workspace/image_tag.txt)
      echo "================================================"
      echo "Applying Terraform — Full Infrastructure"
      echo "================================================"
      echo "Image Tag: $$IMAGE_TAG"
      # The Eventarc API intermittently answers trigger reads with a
      # "Pub/Sub topic status is unknown" condition that crashes the provider's
      # refresh. Retry only on that signature; any other error fails fast.
      # Apply is idempotent, so re-running after the flap is safe.
      attempt=1
      while :; do
        set +e
        terraform apply \
          -var-file=${_ENVIRONMENT}_config.tfvars \
          -var="image_tag=$$IMAGE_TAG" \
          -var="image_name=${_IMAGE_NAME}" \
          -auto-approve > /tmp/tf_out.log 2>&1
        rc=$?
        set -e
        cat /tmp/tf_out.log
        if [ "$$rc" -eq 0 ]; then
          break
        fi
        if [ "$$attempt" -ge 3 ] || ! grep -q "Pub/Sub topic status is unknown" /tmp/tf_out.log; then
          exit "$$rc"
        fi
        attempt=$((attempt+1))
        echo "⚠️  Eventarc API flap detected — retrying terraform apply ($$attempt/3) in 30s..."
        sleep 30
      done
      echo ""
      echo "✅ Terraform apply completed!"
      echo "================================================"
      echo "Terraform Outputs"
      echo "================================================"
      terraform output
    else
      echo "⏭️  Plan-only mode. Skipping apply."
    fi

# ========================================
# Step 16: Deployment Summary
# ========================================
- name: 'gcr.io/cloud-builders/gcloud'
  id: 'summary'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -eo pipefail
    IMAGE_TAG=$(cat /workspace/image_tag.txt)

    echo ""
    echo "================================================"
    echo "✅ Deployment Complete!"
    echo "================================================"
    echo "Environment:        ${_ENVIRONMENT}"
    echo "Project:            $PROJECT_ID"
    echo "Region:             ${_REGION}"
    echo "Image Tag:          $$IMAGE_TAG"
    echo "================================================"
    echo "Resources:"
    echo "  • Cloud Run Job:  ${_ENVIRONMENT}-tax-invoice-extraction-job"
    echo "  • Scheduler:      ${_ENVIRONMENT}-tax-invoice-extraction-scheduler"
    echo "  • Image:          ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:$$IMAGE_TAG"
    echo "  • Timezone:       ${_TIMEZONE}"
    echo "================================================"
    echo ""
    echo "🔗 Quick Links:"
    echo "Cloud Run: https://console.cloud.google.com/run/jobs/details/${_REGION}/${_ENVIRONMENT}-tax-invoice-extraction-job?project=$PROJECT_ID"
    echo "Scheduler: https://console.cloud.google.com/cloudscheduler?project=$PROJECT_ID"
    echo "Artifact Registry: https://console.cloud.google.com/artifacts/docker/$PROJECT_ID/${_REGION}/${_REPOSITORY}/${_IMAGE_NAME}?project=$PROJECT_ID"
    echo "================================================"

options:
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET

timeout: 3600s  # 60 minutes
